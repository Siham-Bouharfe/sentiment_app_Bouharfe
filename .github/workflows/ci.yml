name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Environnement et dépendances figées
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Diagnostic
        run: . .venv/bin/activate && python scripts/check_setup.py
      - name: Modèle de démonstration
        run: . .venv/bin/activate && python src/make_demo.py && python src/train.py
      - name: Qualité statique
        run: . .venv/bin/activate && python -m ruff check . && python -m mypy api
      - name: Tests et couverture API
        run: . .venv/bin/activate && python -m pytest --cov=api --cov-fail-under=95 -q
      - name: Roue installée hors du dépôt (TP6)
        run: |
          . .venv/bin/activate
          python -m build --wheel
          python -m venv /tmp/roue-tp6
          /tmp/roue-tp6/bin/python -m pip install dist/*.whl
          cd /tmp
          if /tmp/roue-tp6/bin/sentiment predict "Livraison rapide, produit conforme, très satisfait"; then
            echo "Le modèle ne doit pas être inclus dans la roue"
            exit 1
          fi
          SENTIMENT_MODELE="$GITHUB_WORKSPACE/models/sentiment.joblib" /tmp/roue-tp6/bin/sentiment predict "Livraison rapide, produit conforme, très satisfait" > /tmp/prediction-tp6.json
          cat /tmp/prediction-tp6.json
          /tmp/roue-tp6/bin/python -c 'import json; r=json.load(open("/tmp/prediction-tp6.json")); assert r["label"] == "POSITIVE" and abs(r["score"] - 0.777) < 0.001'
      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preuves-tp6
          path: |
            models/metrics.json
            dist/*.whl
